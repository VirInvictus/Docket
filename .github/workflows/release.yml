name: Release

# A v* tag is always hand-cut (forward-only policy, verbatim patchnotes
# message); this workflow answers it with the same checks CI runs on
# main, then creates the GitHub Release from the tag's own verbatim
# message and attaches the installed-prefix artifact (the house rule:
# releases carry the real artifact). Quire's release job is the shape.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-release:
    name: checks, then Release from tag with the built artifact
    runs-on: ubuntu-latest
    # Pinned (not fedora:latest): a release build must be reproducible
    # against the toolchain it shipped with, and 44 is the committer's
    # own Fedora.
    container: fedora:44
    # Cold first run: no cache on a fresh tag, dnf + clippy + test
    # + a from-scratch release build.
    timeout-minutes: 45
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            gh \
            pkgconf-pkg-config \
            glib2-devel \
            gtk4-devel \
            gtksourceview5-devel \
            appstream \
            desktop-file-utils \
            zstd

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The default shallow checkout carries no tag object, and
          # `gh release create --notes-from-tag` then silently falls
          # back to the target commit's message for the release body
          # (the Quire precedent shipped exactly that and was repaired
          # by hand). The full clone lets the server-side read below
          # fetch the annotated tag's verbatim message, which is what
          # the release body must be.
          fetch-depth: 0

      - name: VERSION sync guard
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CARGO_VERSION="$(grep -m1 '^version =' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          FILE_VERSION="$(cat VERSION)"
          if [ -z "$FILE_VERSION" ]; then
            echo "VERSION is empty; it is the single source of truth and the release tags it" >&2
            exit 1
          fi
          if [ "$FILE_VERSION" != "$CARGO_VERSION" ]; then
            echo "VERSION ($FILE_VERSION) != workspace Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi
          if [ "v$FILE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag ($GITHUB_REF_NAME) != VERSION ($FILE_VERSION)" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite is headless pure functions (no widget tests), so no
      # display and no xvfb here.
      - name: cargo test
        run: cargo test --workspace

      - name: Validate the desktop file and AppStream metadata
        run: |
          desktop-file-validate data/io.github.virinvictus.Docket.desktop
          appstreamcli validate --no-net data/io.github.virinvictus.Docket.metainfo.xml

      # Plain cargo, no meson wrapper: stage the GNOME-shaped install
      # tree by hand. No GSettings schema to compile: state lives in
      # plain files under the XDG dirs, so the staged tree is complete
      # as installed.
      - name: Build and stage the install tree
        run: |
          cargo build --release --package docket
          install -Dm755 target/release/docket stage/usr/bin/docket
          install -Dm644 data/io.github.virinvictus.Docket.desktop \
            stage/usr/share/applications/io.github.virinvictus.Docket.desktop
          install -Dm644 data/io.github.virinvictus.Docket.metainfo.xml \
            stage/usr/share/metainfo/io.github.virinvictus.Docket.metainfo.xml
          install -Dm644 data/icons/hicolor/scalable/apps/io.github.virinvictus.Docket.svg \
            stage/usr/share/icons/hicolor/scalable/apps/io.github.virinvictus.Docket.svg
          for sz in 128 256; do
            install -Dm644 data/icons/hicolor/${sz}x${sz}/apps/io.github.virinvictus.Docket.png \
              stage/usr/share/icons/hicolor/${sz}x${sz}/apps/io.github.virinvictus.Docket.png
          done

      - name: Pack the artifact
        run: |
          test -x stage/usr/bin/docket
          tar --zstd -cf "docket-${GITHUB_REF_NAME}-x86_64.tar.zst" -C stage .

      - name: Create the Release from the tag's verbatim message
        env:
          GH_TOKEN: ${{ github.token }}
        # --notes-from-tag has proven unreliable inside Actions (the
        # Quire v0.2.0 body came out as the commit message even with
        # the full checkout), and the local `git tag -l
        # --format=%(contents)` extraction failed the same way on
        # Quire v0.3.0. Server-side read instead: the refs API gives
        # the tag object's SHA, the tags API gives the annotated
        # tag's message. Deterministic: the body IS the entry.
        run: |
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.message' > tag-notes.md
          wc -c tag-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "docket-${GITHUB_REF_NAME}-x86_64.tar.zst" \
            --notes-file tag-notes.md \
            --verify-tag \
            --title "$GITHUB_REF_NAME"
